# Integration skills - example-based (code + docs)
# The variant table: one row per framework variant, and the build turns each row into one pack.
# `framework` = the detection id a variant serves; `default: true` marks the family default. Both are emitted into skill-menu.json.
# `match` = the trait values a pack is written for, published as `key:value` tags. A key is a trait name as the wizard spells
#   it. `frameworkVariant` is the id the wizard's framework config reports. A row with no `frameworkVariant` serves every
#   value its family's other rows do not name.
# `docs` = each product's pages for the variant. The build writes them to `references/<product>/` and lists them in the
#   pack's `variant.json`. Every row lists every product in `products`, or names it under `gaps`.
type: skill
products: [error-tracking, feature-flags]
template: description.md
description: PostHog integration for {display_name} applications
shared_docs:
  - https://posthog.com/docs/getting-started/identify-users.md
variants:
  - id: nextjs-app-router
    framework: nextjs
    default: true
    example_paths: example-apps/next-app-router
    display_name: Next.js App Router
    tags: [nextjs, react, ssr, app-router, javascript, javascript_web, javascript_node]
    docs_urls:
      - https://posthog.com/docs/libraries/next-js.md
    match: { framework: nextjs, frameworkVariant: app-router }
    docs:
      error-tracking:
        - https://posthog.com/docs/error-tracking/installation/nextjs.md
      feature-flags:
        - https://posthog.com/docs/feature-flags/installation/react.md
        - https://posthog.com/docs/libraries/next-js.md
        - https://posthog.com/docs/feature-flags/installation/nodejs.md

