# Metrics skills - docs-only (no example projects)
type: skill
template: description.md
description: PostHog metrics for {display_name}
tags: [metrics]
shared_docs:
  - https://posthog.com/docs/metrics/start-here.md
  - https://posthog.com/docs/metrics/basics.md
  - https://posthog.com/docs/metrics/architecture.md
variants:
  - id: javascript
    display_name: Web (JavaScript)
    tags: [javascript_web, javascript]
    # Browser-only frameworks: metrics ride posthog-js.
    frameworks: [javascript_web, vue, angular]
    docs_urls:
      - https://posthog.com/docs/metrics/installation/javascript.md

  - id: nodejs
    display_name: Node.js
    tags: [javascript]
    # Server and full-stack JS frameworks: metrics measure service work, so
    # full-stack apps take the server variant.
    frameworks: [javascript_node, nextjs, nuxt, react-router, tanstack-start, tanstack-router, sveltekit, astro]
    docs_urls:
      - https://posthog.com/docs/metrics/installation/nodejs.md

  - id: python
    display_name: Python
    tags: [python]
    frameworks: [python, django, flask, fastapi]
    docs_urls:
      - https://posthog.com/docs/metrics/installation/python.md

  - id: kubernetes
    display_name: Kubernetes
    tags: [kubernetes]
    docs_urls:
      - https://posthog.com/docs/metrics/installation/kubernetes.md

  - id: other
    display_name: Other Languages
    tags: []
    # Plain OTLP exporter for languages without posthog.metrics SDK support.
    frameworks: [laravel, rails, ruby]
    docs_urls:
      - https://posthog.com/docs/metrics/installation/other.md
