# PostHog Python SDK — exact-major reference & migration skills
type: docs-only
category: sdk
cli:
  role: internal
description: PostHog Python SDK {display_name} reference
variants:
  - id: v7
    display_name: 7.x.x
    template: ../non-default-major.md
    match: { posthogSdks: ["posthog@3", "posthog@4", "posthog@5", "posthog@6", "posthog@7"] }
    docs_urls:
      - https://posthog.com/docs/libraries/python/7.x.x.md
      - https://posthog.com/docs/libraries/python/migration.md

  - id: v8
    default: true
    display_name: 8.x.x
    template: ../default-major.md
    match: { posthogSdks: ["posthog@8"] }
    docs_urls:
      - https://posthog.com/docs/libraries/python/8.x.x.md
