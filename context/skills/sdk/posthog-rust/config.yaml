# PostHog Rust SDK — exact-major reference & migration skills
type: docs-only
category: sdk
cli:
  role: internal
description: PostHog Rust SDK {display_name} reference
variants:
  - id: v0
    display_name: 0.x.x
    template: ../non-default-major.md
    tags: [sdk-rust-0]
    match: { sdkRust: "0" }
    docs_urls:
      - https://posthog.com/docs/libraries/rust/0.x.x.md
      - https://posthog.com/docs/libraries/rust/migration.md

  - id: v1
    default: true
    display_name: 1.x.x
    template: ../default-major.md
    tags: [sdk-rust-1]
    match: { sdkRust: "1" }
    docs_urls:
      - https://posthog.com/docs/libraries/rust/1.x.x.md
