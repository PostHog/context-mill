# PostHog iOS SDK — exact-major reference & migration skills
type: docs-only
category: sdk
cli:
  role: internal
description: PostHog iOS SDK {display_name} reference
variants:
  - id: v3
    display_name: 3.x.x
    template: ../non-default-major.md
    match: { sdkIos: ["3"] }
    docs_urls:
      - https://posthog.com/docs/libraries/ios/3.x.x.md
      - https://posthog.com/docs/libraries/ios/migration.md

  - id: v4
    default: true
    display_name: 4.x.x
    template: ../default-major.md
    match: { sdkIos: ["4"] }
    docs_urls:
      - https://posthog.com/docs/libraries/ios/4.x.x.md
