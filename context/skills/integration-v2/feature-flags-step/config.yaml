# Orchestrator step-skill: fetched by task agents, never surfaced as a command.
# The framework matrix mirrors the canonical integration group's ids, but the
# docs are flag pages: integration's docs_urls teach SDK install and would give
# the evaluate task nothing about evaluating once, flag-key constants, or
# reporting evaluations back.
type: docs-only
template: description.md
description: Evaluate the example PostHog feature flags, one per side of the app
tags: [orchestrator, feature-flags]
cli:
  role: internal
shared_docs:
- https://posthog.com/docs/feature-flags/adding-feature-flag-code.md
- https://posthog.com/docs/feature-flags/best-practices.md
- https://posthog.com/docs/feature-flags/local-evaluation.md
