# Transactional email skill - one email to one person, from a template file in the repository
type: skill
template: description.md
category: workflows
description: Send transactional email from code with PostHog, such as a welcome email, a password reset, a signup confirmation, or a receipt. Use when asked to send an email from a Node.js app or other server code. It verifies a sender through the PostHog MCP, writes the email as an HTML template file in the repository, uploads it by key, and writes the send with posthog-node or the HTTP API.
