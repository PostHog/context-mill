name: Build and release

on:
  push:
    branches: [main]
    # Only fire when release-please's outputs land on main. The release PR
    # merge is the only merge that touches these three files together —
    # feature/fix PRs typically don't touch any of them, so the whole
    # workflow (including check-version) stays silent on non-release merges.
    # check-version is still the correctness gate for the rare edge case
    # (e.g. a dependency PR that touches package.json without bumping the
    # version).
    paths:
      - 'package.json'
      - '.release-please-manifest.json'
      - 'CHANGELOG.md'
  workflow_dispatch:

# Minimal default; jobs scope up only what they need. build-and-release needs
# `contents: write` to create/edit the GitHub release and force-push the
# `latest` tag; check-version only reads the checkout and calls the read-only
# `/releases/latest` API.
permissions:
  contents: read

jobs:
  check-version:
    name: Check for a new version to release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      is-new-version: ${{ steps.check.outputs.is-new-version }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Compare package.json's version to the tag of the latest PUBLISHED
      # (non-draft, non-prerelease) GitHub release. release-please only bumps
      # package.json (via its PR); it never creates a release. So a mismatch
      # here means "the release PR merged and we still owe the world a shipped
      # release for this version" — even on a workflow_dispatch retry after a
      # partially-failed run, this still evaluates true because the release
      # never got flipped out of draft.
      - name: Compare package.json to latest published release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' package.json)
          LATEST_PUBLISHED_TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name' 2>/dev/null || echo "v0.0.0")
          LATEST_PUBLISHED_VERSION=${LATEST_PUBLISHED_TAG#v}
          echo "package.json version: ${VERSION}"
          echo "latest published release: ${LATEST_PUBLISHED_TAG}"
          # Compare versions, don't just test inequality. A bare `!=` treats a
          # BACKWARDS version as releasable, and releasing backwards is
          # destructive: "Create or reuse draft release" reuses the existing
          # release, every asset is re-uploaded with --clobber, `latest` moves
          # back to the older version, and the S3 mirror prefix is overwritten.
          # A reverted release-please commit or a merge conflict resolved toward
          # the older side is enough to trigger it.
          #
          # `sort -V` orders plain X.Y.Z correctly. It disagrees with semver on
          # prereleases (it ranks 1.0.0-rc1 above 1.0.0), which can't bite here:
          # /releases/latest never returns a prerelease, and we don't publish
          # any. If that changes, the miss is benign anyway — a prerelease tag is
          # a new tag and a new prefix, so it can't overwrite a published one.
          NEWEST=$(printf '%s\n%s\n' "$VERSION" "$LATEST_PUBLISHED_VERSION" | sort -V | tail -1)
          if [ "$VERSION" = "$LATEST_PUBLISHED_VERSION" ]; then
            echo "is-new-version=false" >> "$GITHUB_OUTPUT"
          elif [ "$NEWEST" != "$VERSION" ]; then
            echo "::error::package.json is ${VERSION} but ${LATEST_PUBLISHED_VERSION} is already published — refusing to release backwards"
            exit 1
          else
            echo "is-new-version=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

  build-and-release:
    name: Build, tag, upload assets, publish release
    needs: check-version
    if: needs.check-version.outputs.is-new-version == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create/edit releases, push `latest` tag
      pull-requests: write   # relabel release-please's PR after publish
      issues: write          # create the "autorelease: tagged" label if missing
      id-token: write        # OIDC for the S3 mirror upload
    env:
      RELEASE_VERSION: ${{ needs.check-version.outputs.version }}
      RELEASE_TAG: ${{ needs.check-version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/*'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install

      - name: Build skills
        env:
          BUILD_VERSION: ${{ env.RELEASE_VERSION }}
        run: pnpm run build

      - name: Scan skills with Warlock
        env:
          CONTEXT_MILL_WARLOCK_POSTHOG_PERSONAL_KEY: ${{ secrets.CONTEXT_MILL_WARLOCK_POSTHOG_PERSONAL_KEY }}
        run: node scripts/scan-warlock.js dist/skills

      - name: List build artifacts
        run: |
          echo "=== dist/ ==="
          ls -lh dist/
          echo "=== dist/skills/ ==="
          ls -lh dist/skills/

      # Extract the CHANGELOG.md section for this version. release-please's
      # release PR appended a "## [X.Y.Z] (date)" block at the top; slice from
      # that header up to (but not including) the next "## [" header.
      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v version="$RELEASE_VERSION" '
            /^## \[/ {
              if (in_section) exit
              if ($0 ~ "^## \\[" version "\\]") { in_section = 1; next }
            }
            in_section { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          echo "=== extracted release notes ==="
          cat /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "WARN: no CHANGELOG.md section found for v${RELEASE_VERSION}; falling back to a stub body"
            printf 'Automated release of PostHog integration resources for AI agents.\n\n**Version:** %s\n**SHA:** %s\n' "$RELEASE_VERSION" "$GITHUB_SHA" > /tmp/release-notes.md
          fi

      # Idempotent: if a draft release for RELEASE_TAG already exists (from a
      # previous partial run), reuse it. Otherwise create a fresh draft. Either
      # way, the tag is created if it doesn't yet exist — release-please stopped
      # doing that when we set skip-github-release, so build-release is the sole
      # tag writer for RELEASE_TAG.
      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists — reusing."
          else
            echo "Creating draft release $RELEASE_TAG at ${GITHUB_SHA}..."
            gh release create "$RELEASE_TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Release $RELEASE_TAG" \
              --notes-file /tmp/release-notes.md
          fi

      - name: Upload skills bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" ./dist/skills-mcp-resources.zip --clobber

      - name: Upload individual skill ZIPs and skill menu
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Upload each skill ZIP as a release asset
          for file in dist/skills/*.zip; do
            filename=$(basename "$file")
            echo "Uploading $filename..."
            gh release upload "$RELEASE_TAG" "$file" --clobber
          done
          # Upload skill-menu.json (used by the wizard to discover available skills)
          echo "Uploading skill-menu.json..."
          gh release upload "$RELEASE_TAG" dist/skills/skill-menu.json --clobber
          # Upload the orchestrator agent prompts + menu (flat asset names)
          gh release upload "$RELEASE_TAG" dist/agents/agent-menu.json dist/agents/agents-*.md --clobber
          # Upload each bundled group (one JSON of every variant, in place of per-variant ZIPs)
          for file in dist/skills/*.json; do
            filename=$(basename "$file")
            case "$filename" in manifest.json|skill-menu.json) continue ;; esac
            echo "Uploading $filename..."
            gh release upload "$RELEASE_TAG" "$file" --clobber
          done
          # Upload reference docs (used by the wizard for runtime-specific overrides)
          for file in dist/skills/*.md; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            echo "Uploading $filename..."
            gh release upload "$RELEASE_TAG" "$file" --clobber
          done

      - name: Publish release
        id: publish
        # Every asset (bundle, skill ZIPs, skill-menu.json, docs) is now uploaded,
        # so flip the draft to published atomically. This is the point
        # `releases/latest` moves to the new version — the wizard never sees it
        # without skill-menu.json.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Update latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      # release-please labels every release PR `autorelease: pending` and expects
      # its own release step to flip that label to `autorelease: tagged`. Since
      # we set `skip-github-release: true` (build-release owns the release,
      # not release-please), that transition never happens on its own — and
      # release-please refuses to open the next release PR while any merged
      # release PR is still labeled `autorelease: pending` ("There are
      # untagged, merged release PRs outstanding - aborting"). This step closes
      # the lifecycle manually so release-please can move on.
      - name: Close release-please PR lifecycle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "autorelease: tagged" --color ededed \
            --description "Release-please: release for this PR was cut" 2>/dev/null || true
          PR=$(gh pr list --state merged --label "autorelease: pending" --limit 1 --json number --jq '.[0].number // ""')
          if [ -n "$PR" ]; then
            echo "Flipping PR #$PR: autorelease:pending -> autorelease:tagged"
            gh pr edit "$PR" --remove-label "autorelease: pending" --add-label "autorelease: tagged"
          else
            echo "No merged release PR with 'autorelease: pending' — nothing to do."
          fi

      # Fire Slack once the release is genuinely shipped for consumers (draft
      # flipped to --latest, `latest` git tag moved, release-please PR
      # lifecycle closed). The downstream mirror steps below (PostHog/skills,
      # PostHog/ai-plugin) are useful side effects but not gating for the
      # wizard, so their failure shouldn't swallow the release announcement.
      - name: Notify Slack of release
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_WIZARD_RELEASES }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":rocket: context-mill *<https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}|${{ env.RELEASE_TAG }}>* released"
            }

      - name: Generate skills repo token
        id: skills_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.SKILLS_PUSH_APP_ID }}
          private-key: ${{ secrets.SKILLS_PUSH_APP_PRIVATE_KEY }}
          repositories: skills,ai-plugin

      - name: Push plugins to skills repo
        id: skills_push
        env:
          SKILLS_REPO_TOKEN: ${{ steps.skills_token.outputs.token }}
        run: |
          MANIFEST="dist/push-manifest.json"
          TARGET_REPO=$(jq -r '.target_repo' "$MANIFEST")
          # ghcommit-action resolves its `repository` input under $GITHUB_WORKSPACE,
          # so the clone lives there rather than in a mktemp dir.
          WORK_DIR="$GITHUB_WORKSPACE/.skills-push"
          rm -rf "$WORK_DIR"

          echo "Cloning $TARGET_REPO..."
          git clone "https://x-access-token:${SKILLS_REPO_TOKEN}@github.com/${TARGET_REPO}.git" "$WORK_DIR"
          {
            echo "target_repo=$TARGET_REPO"
            echo "target_branch=$(git -C "$WORK_DIR" rev-parse --abbrev-ref HEAD)"
          } >> "$GITHUB_OUTPUT"

          # Read each plugin entry from the push manifest and sync to the destination
          jq -c '.plugins[]' "$MANIFEST" | while read -r entry; do
            NAME=$(echo "$entry" | jq -r '.name')
            SOURCE="dist/$(echo "$entry" | jq -r '.source')"
            DEST="$WORK_DIR/$(echo "$entry" | jq -r '.destination')"

            echo "  Syncing $NAME → $(echo "$entry" | jq -r '.destination')"

            # Clear destination (preserve README.md if present)
            if [ -d "$DEST" ]; then
              find "$DEST" -mindepth 1 -not -name 'README.md' -not -name '.' -exec rm -rf {} + 2>/dev/null || true
            fi
            mkdir -p "$DEST"

            # Copy plugin contents
            cp -r "$SOURCE"/. "$DEST"/
          done

          cd "$WORK_DIR"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to push"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Both target repos require signed commits, so the mirrored content is
      # committed through the GitHub API instead of pushed with git.
      - name: Commit plugins to skills repo
        if: steps.skills_push.outputs.changed == 'true'
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          commit_message: Update generated plugins from context-mill ${{ env.RELEASE_TAG }}
          repo: ${{ steps.skills_push.outputs.target_repo }}
          branch: ${{ steps.skills_push.outputs.target_branch }}
          repository: .skills-push
        env:
          GITHUB_TOKEN: ${{ steps.skills_token.outputs.token }}

      - name: Push omnibus skills to ai-plugin repo
        id: ai_plugin_push
        env:
          SKILLS_REPO_TOKEN: ${{ steps.skills_token.outputs.token }}
        run: |
          # Under $GITHUB_WORKSPACE so ghcommit-action can resolve it (see above).
          WORK_DIR="$GITHUB_WORKSPACE/.ai-plugin-push"
          rm -rf "$WORK_DIR"
          MEGA_SKILLS="dist/marketplace/plugins/posthog-all/skills"

          echo "Cloning PostHog/ai-plugin..."
          git clone "https://x-access-token:${SKILLS_REPO_TOKEN}@github.com/PostHog/ai-plugin.git" "$WORK_DIR"
          echo "target_branch=$(git -C "$WORK_DIR" rev-parse --abbrev-ref HEAD)" >> "$GITHUB_OUTPUT"

          # Sync each omnibus skill, stripping the "omnibus-" prefix to match ai-plugin's layout
          for src in "$MEGA_SKILLS"/omnibus-*; do
            SKILL_NAME=$(basename "$src" | sed 's/^omnibus-//')
            DEST="$WORK_DIR/skills/$SKILL_NAME"

            echo "  Syncing $SKILL_NAME"
            rm -rf "$DEST/references" "$DEST/SKILL.md"
            mkdir -p "$DEST"
            cp -r "$src/references" "$DEST/"
            cp "$src/SKILL.md" "$DEST/"
          done

          cd "$WORK_DIR"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to push to PostHog/ai-plugin"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit omnibus skills to ai-plugin repo
        if: steps.ai_plugin_push.outputs.changed == 'true'
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          commit_message: Update generated skills from context-mill ${{ env.RELEASE_TAG }}
          repo: PostHog/ai-plugin
          branch: ${{ steps.ai_plugin_push.outputs.target_branch }}
          repository: .ai-plugin-push
        env:
          GITHUB_TOKEN: ${{ steps.skills_token.outputs.token }}

      # Both clones embed the App token in their remote URL and now live in the
      # workspace rather than a mktemp dir, so drop them before any later step runs.
      - name: Remove the mirror clones
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/.skills-push" "$GITHUB_WORKSPACE/.ai-plugin-push"

      # Mirror the release to S3 so consumers have a second origin to fetch from
      # when GitHub Releases is unavailable.
      #
      # Deliberately the LAST thing the job does. Two constraints pull in
      # opposite directions:
      #
      #   - It must run after "Publish release", so GitHub stays the source of
      #     truth and a mirror failure can never unwind a durable release.
      #   - It must not run before "Update latest tag" or "Close release-please
      #     PR lifecycle". Those are release-critical: a failure here would skip
      #     them, stranding the `latest` tag and leaving the release PR labelled
      #     `autorelease: pending`, which blocks the NEXT release entirely.
      #
      # Running last satisfies both — everything release-critical has already
      # completed, and this step still fails the run loudly if the mirror breaks.
      # It only reads dist/, which nothing above mutates.
      #
      # Running last also means the default "skip if any earlier step failed"
      # rule would let the PostHog/skills and PostHog/ai-plugin mirrors above
      # take S3 down with them — which is exactly what happened in v1.47.0, when
      # a transient 502 from the skills commit skipped this step and the release
      # shipped with no S3 mirror. Those two mirrors are explicitly NOT gating
      # (see the "Notify Slack" comment above), so the condition below keys off
      # the release actually being published rather than off the whole job's
      # health. `!cancelled()` is what opts out of the default skip-on-failure;
      # it's preferred over `always()` so a cancelled run doesn't still upload.
      # If anything release-critical failed, `publish` never ran, its conclusion
      # isn't 'success', and the mirror correctly stays skipped.
      #
      # The action uploads the versioned prefix, verifies it over HTTPS, and only
      # then moves /latest to it. Ordering is the safety argument: the prefix is
      # immutable and unreferenced until the pointer moves, so any failure before
      # that leaves /latest on the previous good release.
      - name: Mirror release to S3
        id: mirror
        if: ${{ !cancelled() && steps.publish.conclusion == 'success' }}
        uses: ./.github/actions/mirror-to-s3
        with:
          version: ${{ env.RELEASE_VERSION }}
          role-to-assume: ${{ secrets.AWS_CONTEXT_MILL_RELEASES_ROLE_ARN }}
          bucket: ${{ secrets.AWS_CONTEXT_MILL_RELEASES_BUCKET }}
          aws-region: ${{ secrets.AWS_CONTEXT_MILL_RELEASES_REGION }}
          # The only caller that moves the pointer.
          flip-latest: "true"
          kvs-arn: ${{ secrets.AWS_CONTEXT_MILL_RELEASES_KVS_ARN }}

      # always(), because the S3 mirror is the only step after the release is
      # already published. If the mirror fails we still want the release summary
      # rendered — losing it would make a fully-successful release look opaque.
      - name: Build Summary
        if: always()
        env:
          MIRROR_PREFIX: ${{ steps.mirror.outputs.prefix }}
          MIRROR_COUNT: ${{ steps.mirror.outputs.object-count }}
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** $RELEASE_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** $RELEASE_TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **Bundle:** skills-mcp-resources.zip" >> $GITHUB_STEP_SUMMARY
          # Bucket name comes from a secret, so it would render as *** here. The
          # prefix and object count are the useful parts anyway.
          if [ -n "$MIRROR_PREFIX" ]; then
            echo "- **S3 mirror:** \`$MIRROR_PREFIX/\` ($MIRROR_COUNT objects)" >> $GITHUB_STEP_SUMMARY
            echo "- **Mirror URL:** https://context-mill.posthog.com/latest/skill-menu.json" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **S3 mirror:** :warning: did not complete — the GitHub release above is published and unaffected" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Skills Manifest" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat dist/skills/manifest.json | jq '{version, buildVersion, buildTimestamp, skillCount: (.skills | length)}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Individual Skills" >> $GITHUB_STEP_SUMMARY
          ls -lh dist/skills/*.zip >> $GITHUB_STEP_SUMMARY
