name: Install skill evals

# Runs the omnibus instrument-* skills on Gauge and grades the result.
# Twice a month: the current sample. Manually: the sample, everything, or one skill or app.
on:
  schedule:
    - cron: '0 13 1,15 * *' # The 1st and 15th, after the daily PostHog/skills sync at 12:00 UTC
  workflow_dispatch:
    inputs:
      scope:
        description: 'sample runs the current sample, all runs every selected eval'
        type: choice
        options: [sample, all]
        default: sample
      skill:
        description: 'One skill, such as instrument-integration. Empty for every skill.'
        required: false
      app:
        description: 'Only apps whose path contains this text, such as next-js. Empty for every app.'
        required: false
      agent:
        description: 'Agent and model for every run, such as claude-code:claude-opus-5-5. Empty to split runs across the default agents.'
        required: false

permissions:
  contents: read

concurrency:
  group: install-skill-evals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GAUGE_API_TOKEN: ${{ secrets.GAUGE_API_TOKEN }}
      SCOPE: ${{ inputs.scope || 'sample' }}
      SKILL: ${{ inputs.skill }}
      APP: ${{ inputs.app }}
      AGENT: ${{ inputs.agent }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*

      - name: Install the Gauge CLI
        run: npm install -g @withgauge/cli@0.29.0

      - name: Build the selection
        run: |
          args=()
          [ "$SCOPE" = "sample" ] && args+=(--sample)
          [ -n "$SKILL" ] && args+=(--skill "$SKILL")
          [ -n "$APP" ] && args+=(--app "$APP")
          printf '%s\n' "${args[@]}" > selection.txt
          node evals/install-skills/gauge.mjs plan "${args[@]}"

      - name: Sync saved evals
        run: |
          mapfile -t args < selection.txt
          node evals/install-skills/gauge.mjs sync "${args[@]}"

      - name: Launch runs
        run: |
          mapfile -t args < selection.txt
          [ -n "$AGENT" ] && args+=(--agent "$AGENT")
          node evals/install-skills/gauge.mjs run "${args[@]}"

      - name: Wait for verdicts
        run: |
          mapfile -t args < selection.txt
          [ -n "$AGENT" ] && args+=(--agent "$AGENT")
          node evals/install-skills/gauge.mjs results --wait "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
