name = "posthog-cloudflare-workers-example"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[observability]
enabled = true

# Non-secret config. Local overrides go in .dev.vars (see .dev.vars.example).
# Leave POSTHOG_PROJECT_TOKEN out of [vars] instead of defaulting it to an empty
# string, set it in .dev.vars locally or with wrangler secret put POSTHOG_PROJECT_TOKEN.
# Set ENVIRONMENT to "production" in the deployed Worker to silence the
# missing-token warning.
[vars]
POSTHOG_HOST = "https://us.i.posthog.com"
